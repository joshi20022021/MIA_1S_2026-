<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Disk Manager - EXT2</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: Arial, sans-serif;
    font-size: 14px;
    background: #f0f0f0;
    color: #222;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    background: #fff;
    border-bottom: 1px solid #ccc;
    padding: 10px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  header h1 { font-size: 16px; font-weight: bold; }
  header span { color: #666; font-size: 13px; }
  header .spacer { flex: 1; }

  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 12px;
    gap: 10px;
    overflow: hidden;
  }

  .panel {
    background: #fff;
    border: 1px solid #ccc;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .panel-header {
    background: #e8e8e8;
    border-bottom: 1px solid #ccc;
    padding: 6px 12px;
    font-size: 12px;
    font-weight: bold;
    text-transform: uppercase;
    color: #555;
  }

  #cmdInput {
    font-family: "Courier New", monospace;
    font-size: 13px;
    padding: 10px;
    border: none;
    outline: none;
    resize: vertical;
    min-height: 160px;
    max-height: 300px;
    width: 100%;
    border-bottom: 1px solid #ccc;
  }

  .controls {
    padding: 8px 10px;
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
    border-bottom: 1px solid #ccc;
  }

  button {
    padding: 6px 14px;
    font-size: 13px;
    cursor: pointer;
    border: 1px solid #aaa;
    background: #f5f5f5;
    border-radius: 3px;
  }

  button:hover { background: #e0e0e0; }
  button:disabled { color: #aaa; cursor: default; background: #f5f5f5; }

  #runBtn {
    background: #2563eb;
    color: #fff;
    border-color: #1d4ed8;
    font-weight: bold;
  }

  #runBtn:hover { background: #1d4ed8; }
  #runBtn:disabled { background: #93c5fd; border-color: #93c5fd; }

  #fileBadge {
    display: none;
    font-size: 12px;
    color: #555;
    background: #f0f0f0;
    border: 1px solid #ccc;
    padding: 4px 8px;
    border-radius: 3px;
  }

  #fileBadge.show { display: inline-flex; gap: 6px; align-items: center; }
  #fileBadge .rm { cursor: pointer; color: #c00; font-weight: bold; }

  .output-wrap {
    flex: 1;
    overflow-y: auto;
    min-height: 0;
  }

  #output {
    font-family: "Courier New", monospace;
    font-size: 13px;
    padding: 10px;
    white-space: pre-wrap;
    word-break: break-word;
    min-height: 100%;
    line-height: 1.5;
  }

  #spinner { display: none; font-size: 12px; color: #666; }
</style>
</head>
<body>

<header>
  <h1>Disk Manager EXT2</h1>
  <span>Simulador de sistema de archivos</span>
  <div class="spacer"></div>
</header>

<div class="main">
  <div class="panel">
    <div class="panel-header">Comandos</div>
    <textarea id="cmdInput" placeholder="Escribe tus comandos aqui... (Ctrl+Enter para ejecutar)"></textarea>
    <div class="controls">
      <button id="runBtn" onclick="runCommands()">Ejecutar</button>
      <button onclick="clearAll()">Limpiar</button>
      <button onclick="loadScript()">Cargar script (.txt)</button>
      <input type="file" id="scriptInput" accept=".txt,.sh" style="display:none" onchange="onScriptLoad(event)" />
      <span id="spinner">Ejecutando...</span>
    </div>
    <div class="panel-header">Salida</div>
    <div class="output-wrap">
      <pre id="output"></pre>
    </div>
  </div>
</div>

<script>
let uploadedFilePath = null;

document.getElementById('fileInput').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const fd = new FormData();
  fd.append('file', file);
  const res = await fetch('/api/upload', { method: 'POST', body: fd });
  const data = await res.json();
  uploadedFilePath = data.path;
  document.getElementById('fileLabel').textContent = file.name + ' -> ' + data.path;
  document.getElementById('fileBadge').classList.add('show');
  e.target.value = '';
});

function clearUpload() {
  uploadedFilePath = null;
  document.getElementById('fileBadge').classList.remove('show');
}

function loadScript() { document.getElementById('scriptInput').click(); }
function onScriptLoad(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => { document.getElementById('cmdInput').value = ev.target.result; };
  reader.readAsText(file);
  e.target.value = '';
}

async function runCommands() {
  const commands = document.getElementById('cmdInput').value.trim();
  if (!commands) return;
  setLoading(true);
  document.getElementById('output').textContent = '';
  try {
    const res = await fetch('/api/run', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ commands }),
    });
    const data = await res.json();
    document.getElementById('output').textContent = data.output || '';
  } catch (err) {
    document.getElementById('output').textContent = 'Error de conexion: ' + err.message;
  } finally {
    setLoading(false);
  }
}

function setLoading(on) {
  document.getElementById('runBtn').disabled = on;
  document.getElementById('spinner').style.display = on ? 'inline' : 'none';
}

function clearAll() {
  document.getElementById('cmdInput').value = '';
  document.getElementById('output').textContent = '';
}

document.getElementById('cmdInput').addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') runCommands();
});
</script>
</body>
</html>
